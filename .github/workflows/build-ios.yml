name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot & Templates
        run: |
          mkdir -p ~/godot_tools ~/.local/share/godot/export_templates/4.7.2.stable
          cd ~/godot_tools
          curl -fSL -o godot.zip "https://github.com" || curl -fSL -o godot.zip "https://github.com"
          unzip -q godot.zip
          mv Godot_v* godot_bin
          chmod +x godot_bin
          curl -fSL -o templates.tpz "https://github.com" || curl -fSL -o templates.tpz "https://github.com"
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          cp -r ~/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.6.stable

      - name: Configure Godot Android SDK Path & Debug Keystore
        run: |
          keytool -genkey -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "/home/runner/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" > ~/.config/godot/editor_settings-4.tres

      - name: Export Android APK
        run: |
          mkdir -p artifacts/android
          ~/godot_tools/godot_bin --headless --path game --export-release "Android Tablet" ../artifacts/android/PowerOfChaos-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerOfChaos-Android
          path: artifacts/android/PowerOfChaos-Android.apk

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot & Templates
        run: |
          mkdir -p ~/godot_tools ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable
          cd ~/godot_tools
          curl -fSL -o godot.zip "https://github.com" || curl -fSL -o godot.zip "https://github.com"
          unzip -q godot.zip
          curl -fSL -o templates.tpz "https://github.com" || curl -fSL -o templates.tpz "https://github.com"
          unzip -q templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable/
          cp -r ~/Library/Application\ Support/Godot/export_templates/4.7.2.stable ~/Library/Application\ Support/Godot/export_templates/4.6.stable

      - name: Export iOS Xcode Project
        run: |
          mkdir -p artifacts/ios
          ~/godot_tools/Godot.app/Contents/MacOS/Godot --headless --path game --export-release "iOS" ../artifacts/ios/PowerOfChaos.xcodeproj

      - name: Build Unsigned IPA via Xcode
        run: |
          cd artifacts/ios
          xcodebuild -project PowerOfChaos.xcodeproj -scheme PowerOfChaos -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build
          mkdir -p Payload
          cp -r build/PowerOfChaos.app Payload/
          zip -r PowerOfChaos-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PowerOfChaos-iOS
          path: artifacts/ios/PowerOfChaos-iOS.ipa
