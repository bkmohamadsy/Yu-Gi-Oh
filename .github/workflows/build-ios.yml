name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot 4.4.1 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Build Android APK via Project Builder
        run: |
          mkdir -p artifacts/android
          for d in "$ANDROID_HOME"/build-tools/*; do for f in "$d"/*; do [ -f "$f" ] && [ -x "$f" ] && ln -sf "$f" "$f.exe" && ln -sf "$f" "$f.bat"; done; done
          keytool -genkey -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          LOCALAPPDATA=/tmp APPDATA=/tmp python3 tools/android/build_apk.py --engine-only --work ~/android_work --godot $(which godot) --sdk "$ANDROID_HOME" --debug-keystore ~/debug.keystore --first-build --output artifacts/android/PowerOfChaos-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerOfChaos-Android
          path: artifacts/android/PowerOfChaos-Android.apk

  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot 4.4.1 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Build iOS IPA Package
        run: |
          mkdir -p artifacts/ios/Payload
          godot --headless --path game --export-pack "iOS" ../artifacts/ios/game.pck
          TEMPLATE_ZIP=$(find "$HOME/.local/share/godot/export_templates" -name "iphone.zip" | head -n 1)
          unzip -q "$TEMPLATE_ZIP" -d artifacts/ios/tpl
          APP_DIR=$(find artifacts/ios/tpl -name "*.app" | head -n 1)
          cp -r "$APP_DIR" artifacts/ios/Payload/PowerOfChaos.app
          cp artifacts/ios/game.pck artifacts/ios/Payload/PowerOfChaos.app/PowerOfChaos.pck
          cd artifacts/ios
          zip -r PowerOfChaos-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PowerOfChaos-iOS
          path: artifacts/ios/PowerOfChaos-iOS.ipa
