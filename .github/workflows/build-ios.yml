name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot 4.4.1 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Build Android APK via Project Builder
        run: |
          mkdir -p artifacts/android
          for d in "$ANDROID_HOME"/build-tools/*; do [ -f "$d/apksigner" ] && ln -sf "$d/apksigner" "$d/apksigner.bat"; done
          keytool -genkey -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          LOCALAPPDATA=/tmp APPDATA=/tmp python3 tools/android/build_apk.py --engine-only --work ~/android_work --godot $(which godot) --sdk "$ANDROID_HOME" --debug-keystore ~/debug.keystore --first-build --output artifacts/android/PowerOfChaos-Android.apk



      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerOfChaos-Android
          path: artifacts/android/PowerOfChaos-Android.apk

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot 4.4.1 Standard
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Export iOS Xcode Project
        run: |
          mkdir -p artifacts/ios
          godot --headless --path game --export-release "iOS" ../artifacts/ios/PowerOfChaos.xcodeproj

      - name: Build Unsigned IPA via Xcode
        run: |
          cd artifacts/ios
          xcodebuild -project PowerOfChaos.xcodeproj -scheme PowerOfChaos -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build
          mkdir -p Payload
          cp -r build/PowerOfChaos.app Payload/
          zip -r PowerOfChaos-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PowerOfChaos-iOS
          path: artifacts/ios/PowerOfChaos-iOS.ipa
